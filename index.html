<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .weather-icon {
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        .loading {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="glass-card rounded-3xl p-8 shadow-2xl">
            <h1 class="text-3xl font-bold text-white text-center mb-6">
                <i class="fas fa-cloud-sun mr-2"></i>Weather App
            </h1>
            
            <!-- Search Input -->
            <div class="flex gap-2 mb-6">
                <input 
                    type="text" 
                    id="locationInput" 
                    placeholder="Enter city name..." 
                    class="flex-1 px-4 py-3 rounded-xl bg-white/20 text-white placeholder-white/70 border border-white/30 focus:outline-none focus:ring-2 focus:ring-white/50"
                >
                <button 
                    id="searchBtn" 
                    class="px-6 py-3 bg-white/20 hover:bg-white/30 text-white rounded-xl border border-white/30 transition-all duration-300"
                >
                    <i class="fas fa-search"></i>
                </button>
            </div>
            
            <!-- Location Button -->
            <button 
                id="locationBtn" 
                class="w-full mb-6 px-4 py-3 bg-white/20 hover:bg-white/30 text-white rounded-xl border border-white/30 transition-all duration-300"
            >
                <i class="fas fa-location-crosshairs mr-2"></i>Use My Location
            </button>
            
            <!-- Weather Display -->
            <div id="weatherDisplay" class="hidden">
                <div class="text-center mb-6">
                    <h2 id="cityName" class="text-2xl font-semibold text-white mb-1"></h2>
                    <p id="dateTime" class="text-white/70 text-sm"></p>
                </div>
                
                <div class="flex items-center justify-center mb-6">
                    <img id="weatherIcon" src="" alt="Weather Icon" class="w-32 h-32 weather-icon">
                    <div class="ml-4">
                        <p id="temperature" class="text-6xl font-bold text-white"></p>
                        <p id="description" class="text-xl text-white/80 capitalize"></p>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="glass-card rounded-xl p-4 text-center">
                        <i class="fas fa-temperature-half text-2xl text-white mb-2"></i>
                        <p class="text-white/70 text-sm">Feels Like</p>
                        <p id="feelsLike" class="text-xl font-semibold text-white"></p>
                    </div>
                    <div class="glass-card rounded-xl p-4 text-center">
                        <i class="fas fa-droplet text-2xl text-white mb-2"></i>
                        <p class="text-white/70 text-sm">Humidity</p>
                        <p id="humidity" class="text-xl font-semibold text-white"></p>
                    </div>
                    <div class="glass-card rounded-xl p-4 text-center">
                        <i class="fas fa-wind text-2xl text-white mb-2"></i>
                        <p class="text-white/70 text-sm">Wind Speed</p>
                        <p id="windSpeed" class="text-xl font-semibold text-white"></p>
                    </div>
                    <div class="glass-card rounded-xl p-4 text-center">
                        <i class="fas fa-gauge text-2xl text-white mb-2"></i>
                        <p class="text-white/70 text-sm">Pressure</p>
                        <p id="pressure" class="text-xl font-semibold text-white"></p>
                    </div>
                </div>
            </div>
            
            <!-- Loading State -->
            <div id="loading" class="hidden text-center">
                <div class="loading text-white text-xl">
                    <i class="fas fa-spinner fa-spin mr-2"></i>Loading weather data...
                </div>
            </div>
            
            <!-- Error State -->
            <div id="error" class="hidden text-center">
                <div class="text-white">
                    <i class="fas fa-exclamation-circle text-4xl mb-3"></i>
                    <p id="errorMessage" class="text-lg"></p>
                </div>
            </div>
        </div>
        
        <p class="text-center text-white/50 text-sm mt-4">
            Powered by OpenWeatherMap API
        </p>
    </div>

    <script>
        const API_KEY = 'YOUR_API_KEY'; 
        const BASE_URL = 'https://api.openweathermap.org/data/2.5/weather';
        
        const locationInput = document.getElementById('locationInput');
        const searchBtn = document.getElementById('searchBtn');
        const locationBtn = document.getElementById('locationBtn');
        const weatherDisplay = document.getElementById('weatherDisplay');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        
        // Event Listeners
        searchBtn.addEventListener('click', () => searchWeather(locationInput.value));
        locationInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchWeather(locationInput.value);
        });
        locationBtn.addEventListener('click', getLocationWeather);
        
        // Search weather by city name
        async function searchWeather(city) {
            if (!city.trim()) {
                showError('Please enter a city name');
                return;
            }
            
            showLoading();
            try {
                const response = await fetch(`${BASE_URL}?q=${city}&appid=${API_KEY}&units=metric`);
                const data = await response.json();
                
                if (response.ok) {
                    displayWeather(data);
                } else {
                    showError(data.message || 'City not found');
                }
            } catch (err) {
                showError('Failed to fetch weather data. Please try again.');
            }
        }
        
        // Get weather using geolocation
        function getLocationWeather() {
            if (!navigator.geolocation) {
                showError('Geolocation is not supported by your browser');
                return;
            }
            
            showLoading();
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const { latitude, longitude } = position.coords;
                    try {
                        const response = await fetch(
                            `${BASE_URL}?lat=${latitude}&lon=${longitude}&appid=${API_KEY}&units=metric`
                        );
                        const data = await response.json();
                        
                        if (response.ok) {
                            displayWeather(data);
                        } else {
                            showError(data.message || 'Failed to get weather data');
                        }
                    } catch (err) {
                        showError('Failed to fetch weather data. Please try again.');
                    }
                },
                (err) => {
                    showError('Unable to retrieve your location. Please enable location services.');
                }
            );
        }
        
        // Display weather data
        function displayWeather(data) {
            hideLoading();
            hideError();
            weatherDisplay.classList.remove('hidden');
            weatherDisplay.classList.add('fade-in');
            
            document.getElementById('cityName').textContent = `${data.name}, ${data.sys.country}`;
            document.getElementById('dateTime').textContent = formatDate();
            document.getElementById('temperature').textContent = `${Math.round(data.main.temp)}°C`;
            document.getElementById('description').textContent = data.weather[0].description;
            document.getElementById('weatherIcon').src = 
                `https://openweathermap.org/img/wn/${data.weather[0].icon}@4x.png`;
            document.getElementById('feelsLike').textContent = `${Math.round(data.main.feels_like)}°C`;
            document.getElementById('humidity').textContent = `${data.main.humidity}%`;
            document.getElementById('windSpeed').textContent = `${data.wind.speed} m/s`;
            document.getElementById('pressure').textContent = `${data.main.pressure} hPa`;
        }
        
        // Show loading state
        function showLoading() {
            loading.classList.remove('hidden');
            weatherDisplay.classList.add('hidden');
            error.classList.add('hidden');
        }
        
        // Hide loading state
        function hideLoading() {
            loading.classList.add('hidden');
        }
        
        // Show error message
        function showError(message) {
            hideLoading();
            weatherDisplay.classList.add('hidden');
            error.classList.remove('hidden');
            document.getElementById('errorMessage').textContent = message;
        }
        
        // Hide error message
        function hideError() {
            error.classList.add('hidden');
        }
        
        // Format date
        function formatDate() {
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            return new Date().toLocaleDateString('en-US', options);
        }
    </script>
</body>
</html>
